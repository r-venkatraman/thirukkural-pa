<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<title>குறளும் கீதையும் | Kural & Gita</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="குறளும் கீதையும்">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-bar">
  <div class="brand">
    <h1>குறளும் கீதையும்</h1>
    <p class="tagline">Kural &amp; Gita</p>
  </div>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button id="btn-ta" class="lang-btn active" data-lang="ta">தமிழ்</button>
    <button id="btn-en" class="lang-btn" data-lang="en">English</button>
  </div>
</header>

<nav class="view-tabs" role="group" aria-label="View">
  <button id="tab-today" class="view-tab active">Today</button>
  <button id="tab-browse" class="view-tab">Browse All</button>
</nav>

<main id="app">
  <p class="loading" id="loading">Loading…</p>
</main>

<template id="kural-template">
  <section class="kural-card">
    <button class="back-btn" id="back-to-list" hidden>&larr; Back to list</button>
    <p class="adhikaram"><span data-field="paal"></span> &middot; <span data-field="adhikaram"></span></p>
    <p class="kural-number">குறள் <span data-field="id"></span></p>
    <pre class="kural-text" data-field="kural_ta"></pre>
    <button class="play-btn" id="play-kural" aria-label="Play kural audio">
      <span class="play-icon">&#9658;</span> <span id="play-label">ஒலிக்க · Listen</span>
    </button>
    <pre class="transliteration" data-field="kural_transliteration" hidden></pre>
    <p class="translation" data-field="translation_en"></p>

    <button class="reveal-btn" id="show-core">உரை காட்டு · Show meaning</button>

    <div class="urai-block" id="urai-core-block" hidden>
      <h3 id="urai-core-heading">தெளிவுரை</h3>
      <p data-field="urai_core"></p>
      <button class="reveal-btn secondary" id="show-full">முழு உரை · Full commentary</button>
    </div>

    <div class="urai-block full" id="urai-full-block" hidden>
      <h3 id="urai-full-heading">பரிமேலழகர் உரை</h3>
      <p data-field="urai_full"></p>
    </div>

    <button class="reveal-btn secondary gita-btn" id="show-gita">🕉 கீதையுடன் ஒப்பிடு · Compare with the Gita</button>

    <div class="gita-block" id="gita-block" hidden>
      <div class="gita-header-row">
        <h3 id="gita-heading">Bhagavad Gita Parallel</h3>
        <span class="match-badge" id="match-badge"></span>
      </div>
      <p class="gita-ref" data-field="gita_ref"></p>
      <p class="gita-verse" data-field="gita_verse_translit"></p>
      <p class="gita-verse-en" data-field="gita_verse_en"></p>
      <p class="gita-note" data-field="gita_note"></p>
    </div>

    <button class="share-btn" id="share-kural">
      <span>&#8593;</span> <span id="share-label">Share this kural</span>
    </button>
  </section>
</template>

<template id="list-item-template">
  <button class="kural-list-item">
    <span class="list-item-number"></span>
    <span class="list-item-text"></span>
  </button>
</template>

<template id="adhikaram-group-template">
  <details class="adhikaram-group">
    <summary>
      <span class="adhikaram-group-title"></span>
      <span class="adhikaram-group-range"></span>
    </summary>
    <div class="adhikaram-group-items"></div>
  </details>
</template>

<script src="app.js"></script>
</body>
</html>
