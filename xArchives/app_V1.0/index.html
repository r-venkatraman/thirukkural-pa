<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<title>திருக்குறள் | Thirukkural</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-bar">
  <h1>திருக்குறள்</h1>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button id="btn-ta" class="lang-btn active" data-lang="ta">தமிழ்</button>
    <button id="btn-en" class="lang-btn" data-lang="en">English</button>
  </div>
</header>

<main id="app">
  <p class="loading" id="loading">Loading today's kural…</p>
</main>

<template id="kural-template">
  <section class="kural-card">
    <p class="adhikaram"><span data-field="paal"></span> · <span data-field="adhikaram"></span></p>
    <p class="kural-number">குறள் <span data-field="id"></span></p>
    <pre class="kural-text" data-field="kural_ta"></pre>
    <p class="translation" data-field="translation_en"></p>

    <button class="reveal-btn" id="show-core">உரை காட்டு · Show meaning</button>

    <div class="urai-block" id="urai-core-block" hidden>
      <h3>தெளிவுரை</h3>
      <p data-field="urai_core_ta"></p>
      <button class="reveal-btn secondary" id="show-full">முழு உரை · Full commentary</button>
    </div>

    <div class="urai-block full" id="urai-full-block" hidden>
      <h3>பரிமேலழகர் உரை</h3>
      <p data-field="urai_full_ta"></p>
    </div>
  </section>
</template>

<script src="app.js"></script>
</body>
</html>
